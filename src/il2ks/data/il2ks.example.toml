# il2ks.toml: example configuration for il2ks (FR-OPS-2).
#
# Every setting is listed here with its built-in default, commented out. Uncomment and change what you need;
# whatever you leave out keeps the default shown. `il2ks setup` will copy this file for you.
#
# How settings are combined (later wins): built-in defaults, then this file, then environment variables named
# IL2KS_<SECTION>_<KEY> (for example [logs] dir is IL2KS_LOGS_DIR). Top-level keys have no section part
# (IL2KS_DATA_DIR, IL2KS_LOG_LEVEL, IL2KS_LOG_KEEP_DAYS). Lists in environment variables are comma-separated.
# An empty string "" means "not set". Relative paths in this file are relative to the folder of this file.
#
# Lines that start with "#" followed by a space are explanations; lines like "#key = value" are settings you can
# switch on by removing the "#".

# Where il2ks keeps its database, archives and logs. "" = ./.il2ks-data in the folder you run il2ks from.
#data_dir = ""

# Verbosity of il2ks' own log: DEBUG, INFO, WARNING or ERROR.
#log_level = "INFO"

# il2ks writes one log file per process and day (<data dir>/logs/<process>-YYYY-MM-DD.log); files older than
# this many days are deleted.
#log_keep_days = 14

# For developers only: Django debug mode, http instead of https, an insecure built-in secret key. Never switch it
# on for a site others can reach. (`il2ks web --dev` does this for one run.)
#debug = false

# --- DServer's mission logs (FR-ING-1, FR-ING-10, FR-ING-16) -------------------------------------------------------
#[logs]
# The folder where DServer writes its missionReport(...)[N].txt files. "" = not set; then `il2ks ingest` and
# `il2ks watch` only work with `--from`.
#dir = ""
# What to do with the original files once a mission is archived and stored: "move" (to move_to), "keep" (leave
# them where they are) or "delete".
#after_archive = "move"
# Where "move" puts the originals (one sub-folder per mission). "" = <data dir>/ingested-logs.
#move_to = ""
# true when the logs are copied in from another machine: a part only counts as complete once it has been
# unmodified for [ingest] stable_seconds (FR-ING-16).
#remote = false

# --- When a mission counts as finished, and how often to look (FR-ING-2, FR-ING-16, FR-ING-19) ---------------------
#[ingest]
# A mission is complete if none of its parts was written for this many minutes.
#idle_minutes = 10.0
# After the mission-end marker (AType 7) wait until no part changed for this many seconds: cleanup lines still
# follow it. A newer mission's first file completes a mission at once, so this only delays the last mission.
#settle_seconds = 300.0
# Only with [logs] remote = true: seconds a part must stay unmodified before it counts as fully copied.
#stable_seconds = 60.0
# `il2ks watch` looks for new or finished missions every this many seconds.
#watch_interval_s = 30.0
# After a mission fails to ingest, retry after these many minutes, one entry per retry; then give up until the
# files change or il2ks is upgraded (FR-ING-19).
#retry_backoff_minutes = [5.0, 30.0, 120.0]

# --- Game rules for the replay (FR-ING-14, FR-ING-17, FR-ING-21, FR-ING-22) ----------------------------------------
# A changed rule only affects missions ingested afterwards; run `il2ks reprocess` (optionally --since DATE) to apply
# it to older ones.
#[replay]
# Bailout (FR-ING-14): the pilot's final position must be at least this many metres from the aircraft's last known
# position (closer means a crash landing or climbing out next to the wreck).
#bailout_min_distance_m = 100.0
# Seconds: a pilot killed within this time of the aircraft's destruction died in the aircraft (no bailout).
#died_with_aircraft_s = 0.5
# Seconds: a player who disconnects within this time of the sortie's end counts as disconnected (no early bailout).
#disconnect_window_s = 30.0
# Seconds: a bailout this close to the mission's end is not a "suspected early bailout".
#mission_end_window_s = 60.0
# Seconds after the mission end (AType 7) in which a normal sortie end (AType 4) still counts as "mission ended".
#mission_end_sortie_window_s = 5.0
# A disconnect while still in the aircraft counts as a death only if the aircraft or pilot took damage within this
# many seconds before it (FR-ING-21).
#disconnect_damage_window_s = 120.0
# Suspected structural failure (FR-ING-17): the self-inflicted damage began less than this many seconds before the
# aircraft was destroyed ...
#structural_sudden_s = 1.0
# ... and the wreck kept falling for more than this many seconds before its next ground contact.
#structural_fall_s = 1.0
# An aircraft or pilot destroyed up to this many seconds after the sortie's end still counts for that sortie (the
# shot-down shape logs the sortie end before the kill), or at any time if the pilot left an airborne aircraft
# (FR-ING-22). Applies to sorties that ended airborne.
#post_end_destroy_window_s = 300.0
# The same window for sorties whose aircraft was on the ground at the sortie's end (a parked aircraft destroyed later
# is not the pilot's loss).
#post_end_destroy_window_ground_s = 5.0
# Kill credit (TD-21): every damager above this fraction of the victim's total damage gets an assist (0.01 = 1%).
#assist_min_damage = 0.01
# Resupply (FR-ING-24): the server may let a player rearm after landing and take off again in the same sortie, and no
# log event says so. true = a sortie with a landing followed by another takeoff counts as resupplied, and the ammo
# it "used" is then unknown. false = never assume a resupply.
#resupply_allowed = true
# A pilot's final position (bailout rule, capture) is the one in the pilot's removal line. When that line is missing or
# its position is garbage, the pilot's latest position from a re-declaration within this many seconds of the sortie's end
# is used instead.
#pilot_pos_fallback_window_s = 5.0
# Ammo left: a pilot who leaves a destroyed aircraft (bails out, climbs out) reports its weapon stores as empty. A sortie
# that ended more than this many seconds after its aircraft's destruction has its ammo "used" counted as unknown.
#ammo_left_after_loss_s = 1.0
# Time on target (FR-WEB-20): a bomb, napalm or rocket release counts as an attack when an enemy ground object is
# within this many metres horizontally (releases further away, e.g. jettisoned when intercepted, don't count) ...
#tot_target_radius_m = 3000.0
# ... each attack also counts this many seconds before its first release (the run-in) ...
#tot_lead_in_s = 60.0
# ... and releases more than this many seconds apart are separate attacks (the time between them doesn't count).
#tot_pass_gap_s = 300.0
# Ammo breakdown (FR-WEB-18): a damage line is attributed to the ammo of the attacker's hit on that target that is
# closest in time, if one is within this many seconds (either side). Otherwise the damage stays "unattributed".
#ammo_window_s = 1.0
# Bombs and rockets are logged as "explosion" hits. An explosion is named after a bomb, rocket or shell hit line of the
# same aircraft within this many seconds, else the only ordnance in its loadout, else ...
#ordnance_hit_window_s = 1.0
# ... the ordnance released at most this many seconds before it.
#ordnance_release_window_s = 60.0

# --- Air-to-air ratings (OQ-28, FR-WEB-19) --------------------------------------------------------------------------
# An Elo rating per player and aircraft type (propeller or jet), earned in air-to-air kills between air superiority
# sorties. A changed setting is applied the next time ratings are recomputed (any new mission, or `il2ks
# rebuild-aggregates`).
#[ratings]
# The rating of a player who has no rated kills yet.
#start = 1500.0
# The most one kill can change a rating (kill and loss between two players of the same type of aircraft).
#k = 32.0
# A propeller aircraft that shoots down a jet changes both ratings this many times more (a jet kill on a propeller
# aircraft changes nothing: it was expected).
#cross_pool_weight = 2.0

# --- Backups (FR-OPS-6) --------------------------------------------------------------------------------------------
# `il2ks backup` zips what you could not rebuild from the logs: a consistent copy of the database (hidden players,
# name overrides, branding, admin accounts), this file, the custom/ and media/ folders and the server ID. It goes to
# <data dir>/backups/. The archived mission logs are NOT included: they are large and are kept forever on their own.
# A backup is also made automatically before the database is updated for a new il2ks version, and by `il2ks watch`
# and `il2ks run` once a day. Restore with `il2ks restore <zip>`. Copy the backups to another disk now and then.
#[backup]
# How many backups to keep in <data dir>/backups/; older ones are deleted after each new backup.
#keep = 10
# true = `il2ks watch` makes a backup when the newest one is more than a day old.
#daily = true

# --- This game server (TD-15, TD-17) -------------------------------------------------------------------------------
#[server]
# The timezone of the machine running DServer, as an IANA name such as "Europe/Berlin" or "Asia/Seoul". DServer
# names its logs in local time without a UTC offset, so this decides what instant a mission started.
# "" = detect it: the TZ environment variable, then /etc/localtime (Linux), then UTC. Windows can't be detected:
# set it here unless DServer's machine runs on UTC.
#timezone = ""
# This server's permanent ID (a UUID). "" = generated on first start and kept in <data dir>/server_uid.txt.
# Keep it when you move to a new machine: it identifies the server across reinstalls and backups (TD-17).
#uid = ""

# --- The web server (TD-10, NFR-INS-5) -----------------------------------------------------------------------------
# `il2ks web` (and `il2ks run`) serves the site on this address, for the HTTPS proxy only. Keep it on localhost.
#[web]
# The address to listen on. "127.0.0.1" = this machine only (the proxy in front is the public face).
#host = "127.0.0.1"
# The port to listen on. Change it if something else already uses 8000 (and point an external proxy at it).
#port = 8000
# Worker processes. 1 is plenty for a small machine; Windows supports only 1 (a higher value falls back to 1).
#workers = 1
# Request threads per worker.
#threads = 4
# Extra host names the site may be reached under, besides [https] domain and localhost. Rarely needed.
#allowed_hosts = []
# Django's secret key (signs login cookies). "" = generated on first start and kept in <data dir>/secret_key.txt.
# Keep that file private; deleting it only logs everybody out.
#secret_key = ""

# --- HTTPS (TD-23, NFR-SEC-6) -----------------------------------------------------------------------------------------
# The site is served over HTTPS only. By default `il2ks run` starts Caddy, which gets and renews the certificate
# by itself (ports 80 and 443 must be reachable from the internet, and the domain must point at this machine).
#[https]
# "caddy" = il2ks starts Caddy for you. "external" = you run your own proxy (nginx, IIS, ...) in front of the web
# server; see docs/reverse-proxy.md.
#mode = "caddy"
# The name the site is reached at, like "stats.example.com" (recommended), or this machine's public IP address.
# "" = not set: Caddy then uses a self-signed certificate, which browsers warn about (testing only).
#domain = ""
# Your e-mail address, given to the certificate authority (Let's Encrypt) for expiry warnings. Optional.
#email = ""
# "auto" = a normal certificate from Let's Encrypt. "internal" = Caddy's own self-signed certificate (browser
# warnings; for testing only).
#cert = "auto"
# Where Caddy is. "" = look on the PATH, then in <data dir>/bin.
#caddy_path = ""
# The port Caddy answers plain http on (it only redirects to https and proves to the certificate authority that
# the domain is yours). Must be 80 for a normal certificate.
#http_port = 80
# The port Caddy serves the site on. Must be 443 for a normal certificate.
#https_port = 443
# How long (seconds) browsers must remember to use https only (HSTS). 86400 = one day: raise it (31536000 = a
# year) once everything works, 0 = off. It can't be taken back before it expires, so start small.
#hsts_seconds = 86400
