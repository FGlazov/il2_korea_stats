# Uses the project's own tool versions through uv, so pre-commit, CI and the editor agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: lint-imports
        name: import-linter (core stays pure)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
