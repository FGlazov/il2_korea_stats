# One source of truth: `il2ks dev check` (src/il2ks/devtools/check.py). Agents, the Stop hook, pre-commit and CI all call it.
# It uses the project's own tool versions through uv. Install once per clone (worktrees share it): uv run pre-commit install
# On failure it prints what broke and the fix command; `uv run il2ks dev check --fix` applies the auto-fixable parts.
repos:
  - repo: local
    hooks:
      - id: il2ks-check
        name: il2ks dev check (lint, types, migration/template/translation guards, unit tests)
        entry: uv run il2ks dev check
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
