[project]
name = "il2ks"
dynamic = ["version"]  # single source of truth: __version__ in src/il2ks/__init__.py (see [tool.hatch.version])
description = "Self-hosted statistics website for IL-2 Sturmovik: Korea dedicated servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "django>=5.2,<5.3",
    "granian>=2.0",
    "pillow>=12.3.0",
    "tzdata>=2024.1",  # zoneinfo needs it on Windows (TD-15)
    "whitenoise>=6.7",
]

[project.urls]
Homepage = "https://github.com/FGlazov/il2_korea_stats"
Documentation = "https://github.com/FGlazov/il2_korea_stats/tree/main/docs"
Issues = "https://github.com/FGlazov/il2_korea_stats/issues"

[project.scripts]
il2ks = "il2ks.cli:main"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "babel>=2.18.0",
    "check-jsonschema>=0.38.2",
    "django-types>=0.20",
    "import-linter>=2.1",
    "locust>=2.46.6",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/il2ks/__init__.py"

# The wheel carries everything under src/il2ks: templates, static files (also vendored ones), catalog CSVs, the example
# config, migrations. `artifacts` keeps files that .gitignore would otherwise drop (hatch honours .gitignore): the
# static tree, whose vendored libraries may sit in lib/ or *.min.* folders, and compiled translations (*.mo).
[tool.hatch.build.targets.wheel]
packages = ["src/il2ks"]
artifacts = ["src/il2ks/web/static/**", "src/il2ks/**/*.mo"]

[tool.hatch.build.targets.sdist]
exclude = ["sample_data", ".claude", ".il2ks-data"]

# --- ruff: lint + format (TD-12). ANN = mandatory annotations, ANN401 bans Any.
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["design_doc", "sample_data", ".claude/worktrees", "src/il2ks/serving/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "DJ", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/il2ks/db/migrations/*" = ["RUF012"]
"vulture_whitelist.py" = ["F821", "B018"]
"src/il2ks/db/models.py" = ["RUF012"]  # Django Meta attributes are class-level lists by design
"src/il2ks/web/site_forms.py" = ["RUF012"]  # same: ModelForm.Meta
"tests/unit/catalog/test_object_names.py" = ["RUF001"]  # real Cyrillic expectations (translations), not typos
"tests/integration/test_language.py" = ["RUF001"]  # same

# --- pyright strict (TD-12): core gets zero ignores; Django layers use django-types.
[tool.pyright]
include = ["src", "tests", "packaging"]
extraPaths = ["src", "packaging/windows"]  # src: the default, lost once extraPaths is set; the other: installer build tooling
exclude = ["src/il2ks/db/migrations", "src/il2ks/serving/_vendor"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

# --- pytest: SQLite by default (TD-19); Postgres opt-in with IL2KS_TEST_DB=postgres.
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "il2ks.settings"
testpaths = ["tests"]
pythonpath = ["packaging/windows"]  # build.py, winsw.py, zones.py: the Windows installer's build tooling
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = [
    "postgres: needs a Postgres test database (IL2KS_TEST_DB=postgres); skipped otherwise",
    "sqlite_only: needs the SQLite database (restore, WAL settings); skipped with IL2KS_TEST_DB=postgres",
    "sample_data: runs against the gitignored sample_data/ folder; skipped when it is missing",
    "e2e: browser tests (Playwright, Chromium); skipped unless IL2KS_TEST_E2E=1",
    "perf: server-side timing and query budgets over a bigger seeded world (tests/perf); deselect with -m 'not perf'",
    "allow_console_errors: e2e test that expects the browser to log errors (a 404 page)",
]

# --- import-linter: the core never knows Django exists (TD-07).
[tool.importlinter]
root_package = "il2ks"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is pure Python (no Django, no outer layers)"
type = "forbidden"
source_modules = ["il2ks.core"]
forbidden_modules = ["django", "il2ks.db", "il2ks.web", "il2ks.ingest", "il2ks.queries", "il2ks.settings"]

# --- vulture: dead-code finder. Run over src only, so code that only tests use still shows up (C1).
# min_confidence 60 is needed to see unused functions/classes/methods; the noise is cut by excluding Django glue
# (settings, migrations, models, apps, urls) and by `vulture_whitelist.py` for the rest.
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
# doctor checks are registered by @check (ops.doctor); template tags and filters are found by name in templates
ignore_decorators = ["@check", "@register.*"]
exclude = [
    "src/il2ks/db/migrations/",  # Django reads these by convention
    "src/il2ks/db/models.py",  # fields/choices/Meta are the DB schema, read by Django and the ORM
    "src/il2ks/settings.py",  # Django reads every setting by name
    "src/il2ks/serving/_vendor/",  # third-party code, unmodified
]
