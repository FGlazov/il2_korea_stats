name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the token can only read the repository (no job here writes anything to GitHub).
permissions:
  contents: read

jobs:
  lint:
    # The same command agents and pre-commit run (`il2ks dev check`), minus the tests (the jobs below run those):
    # ruff, format, pyright, import-linter, vulture, makemigrations --check, migration immutability / single leaf,
    # bump-templates --check, translations check. Full history: the migration guard compares with origin/main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run il2ks dev check --no-tests --verbose

  test-sqlite:
    # SQLite is the default test database (TD-19). Windows is the main target platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run pytest -m "not perf"  # the budgets of tests/perf have their own job (test-perf)

  test-postgres:
    # Postgres is dev-side only: one extra job keeps a future switch cheap (TD-04, TD-19).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: il2ks
          POSTGRES_PASSWORD: il2ks
          POSTGRES_DB: il2ks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U il2ks" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IL2KS_TEST_DB: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run pytest -m "not perf"  # the budgets of tests/perf have their own job (test-perf)

  test-perf:
    # Query and time budgets of every public page over a seeded world (tests/perf, marker `perf`; OQ-97). Kept out of
    # the functional jobs so a slow runner never fails them. SQLite first (what ships), then the Postgres service:
    # Postgres plans queries differently and is where a slow query shows up.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: il2ks
          POSTGRES_PASSWORD: il2ks
          POSTGRES_DB: il2ks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U il2ks" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run pytest -m perf -n 0
      - run: uv run pytest -m perf -n 0
        env:
          IL2KS_TEST_DB: postgres

  test-e2e:
    # Browser tests (doc 08): the real app in a child process, driven by Chromium through Playwright. Opt-in locally
    # (IL2KS_TEST_E2E=1); always on here. Traces and screenshots of failures are kept as an artifact.
    runs-on: ubuntu-24.04  # Playwright's --with-deps apt step lags behind new Ubuntu releases (ubuntu-latest moves to 26 on 2026-10-19)
    env:
      IL2KS_TEST_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: >-
          uv run pytest -m e2e --basetemp=e2e-tmp --output=test-results
          --tracing=retain-on-failure --screenshot=only-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            test-results/
            e2e-tmp/**/server.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    # The wheel must carry templates, static files, catalog data, the example config and the migrations (PyPI path).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - run: uv run pytest tests/unit/test_packaging.py
        env:
          IL2KS_TEST_BUILD: "1"

  docker:
    # The image of docs/install-docker.md (doc 07 option A): build it (nothing is pushed) and smoke-test it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile -t il2ks:ci .
      # The CA store Caddy and Python trust: Debian's current one, without the root of the compromised eMudhra
      # intermediates (DSA-6572-1, October 2026).
      - run: >-
          docker run --rm --entrypoint sh il2ks:ci -c
          'dpkg-query -W ca-certificates && ! ls /usr/share/ca-certificates/mozilla/ | grep -i "emSign_ECC_Root_CA_-_G3"'
      - run: docker compose -f docker/compose.yaml config --quiet
        env:
          IL2KS_SERVER_TIMEZONE: UTC
          IL2KS_LOGS_HOST_DIR: /tmp
      - run: docker/smoke-test.sh il2ks:ci
