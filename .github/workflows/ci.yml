name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports

  test-sqlite:
    # SQLite is the default test database (TD-19). Windows is the main target platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  test-postgres:
    # Postgres is dev-side only: one extra job keeps a future switch cheap (TD-04, TD-19).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: il2ks
          POSTGRES_PASSWORD: il2ks
          POSTGRES_DB: il2ks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U il2ks" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IL2KS_TEST_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
