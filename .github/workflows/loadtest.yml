name: Load test

# Manual only (Actions tab -> Load test -> Run workflow): load numbers on a shared runner are too noisy to gate a
# commit on. Seeds a scratch database, runs Locust against `il2ks web --dev`, uploads the report (docs/performance-testing.md).
on:
  workflow_dispatch:
    inputs:
      users:
        description: Concurrent users
        default: "20"
      run_time:
        description: Run time (Locust syntax, e.g. 60s or 3m)
        default: "60s"
      missions:
        description: Missions to seed
        default: "60"

# Least privilege: the token can only read the repository (no job here writes anything to GitHub).
permissions:
  contents: read

jobs:
  loadtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      - name: Seed, serve and load the site
        # Inputs go through the environment, never into the script text (no code injection through an input).
        env:
          USERS: ${{ inputs.users }}
          RUN_TIME: ${{ inputs.run_time }}
          MISSIONS: ${{ inputs.missions }}
        run: >-
          uv run python loadtest/run.py
          -u "$USERS" -t "$RUN_TIME" --missions "$MISSIONS"
          --html loadtest-report.html | tee loadtest-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loadtest-${{ github.run_id }}
          path: |
            loadtest-report.html
            loadtest-report.md
          if-no-files-found: ignore
          retention-days: 30
